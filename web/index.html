      <p class="boot-subtitle">Loading app and preparing modules...</p>
      <div class="boot-bar"><div class="boot-progress"></div></div>
    </div>

  <script>
    function removeBootScreen() {
      const boot = document.getElementById('boot');
      if (boot) {
        boot.remove();
      }
    }

    window.addEventListener('flutter-first-frame', removeBootScreen);

    let tesseractLoadPromise;
    function ensureTesseractLoaded() {
      if (window.Tesseract) {
        return Promise.resolve(window.Tesseract);
      }
      if (tesseractLoadPromise) {
        return tesseractLoadPromise;
      }
      tesseractLoadPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        script.async = true;
        script.onload = () => resolve(window.Tesseract);
        script.onerror = reject;
        document.head.appendChild(script);
      });
      return tesseractLoadPromise;
    }

    async function ocrRecognize(base64Image) {
      try {
        const Tesseract = await ensureTesseractLoaded();
        const worker = await Tesseract.createWorker('eng');
        const { data: { text } } = await worker.recognize('data:image/png;base64,' + base64Image);
        await worker.terminate();
        return text;
      } catch (e) {
        console.error('Tesseract OCR error:', e);
        return '';
      }
    }
  </script>
