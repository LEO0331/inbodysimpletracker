<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="inbodysimpletracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>inbodysimpletracker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f7f9fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #boot {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .boot-card {
      width: min(88vw, 360px);
      padding: 24px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(20, 41, 61, 0.08);
      text-align: center;
    }
    .boot-title {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 700;
      color: #152033;
    }
    .boot-subtitle {
      margin: 0 0 16px;
      color: #556173;
      font-size: 14px;
    }
    .boot-bar {
      width: 100%;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: #e8eef5;
    }
    .boot-progress {
      width: 35%;
      height: 100%;
      background: #1976d2;
      border-radius: 999px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="boot-card">
      <h1 class="boot-title">InBody Tracker</h1>
      <p class="boot-subtitle">Loading app and preparing modules...</p>
      <div class="boot-bar"><div class="boot-progress"></div></div>
    </div>
  </div>
  <script>
    function removeBootScreen() {
      const boot = document.getElementById('boot');
      if (boot) {
        boot.remove();
      }
    }

    window.addEventListener('flutter-first-frame', removeBootScreen);

    let tesseractLoadPromise;
    function ensureTesseractLoaded() {
      if (window.Tesseract) {
        return Promise.resolve(window.Tesseract);
      }
      if (tesseractLoadPromise) {
        return tesseractLoadPromise;
      }
      tesseractLoadPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        script.async = true;
        script.onload = () => resolve(window.Tesseract);
        script.onerror = reject;
        document.head.appendChild(script);
      });
      return tesseractLoadPromise;
    }

    async function ocrRecognize(base64Image) {
      try {
        const Tesseract = await ensureTesseractLoaded();
        const worker = await Tesseract.createWorker('eng');
        const { data: { text } } = await worker.recognize('data:image/png;base64,' + base64Image);
        await worker.terminate();
        return text;
      } catch (e) {
        console.error('Tesseract OCR error:', e);
        return '';
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
