name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # 當推送到 main 分支時觸發
  workflow_dispatch:

permissions:
  contents: read

# Any workflow publishing this branch must use the same concurrency group.
concurrency:
  group: ${{ github.repository }}-gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      BASE_HREF: /inbodysimpletracker/
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify tracked assets are safe to publish
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/check_private_assets.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web (small first-load profile)
        run: |
          flutter build web \
            --release \
            --base-href "${BASE_HREF}" \
            --optimization-level=4 \
            --no-source-maps \
            --no-web-resources-cdn \
            --no-wasm-dry-run

      - name: Remove sourcemaps fallback (if any)
        run: find build/web -name "*.map" -type f -delete

      - name: Verify web assets are safe to publish
        run: python3 .github/scripts/check_private_assets.py --web-dir build/web

      - name: Web bundle size report
        run: |
          echo "Top 20 largest files in build/web:"
          find build/web -type f -print0 | xargs -0 du -h | sort -hr | head -n 20

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
